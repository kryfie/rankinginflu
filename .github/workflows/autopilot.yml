name: InfluRank autopilot

on:
  schedule:
    # Daily discovery + new enrichment.
    # 04:17 UTC = 06:17 in Poland during CEST / 05:17 during CET.
    - cron: "17 4 * * *"

    # Weekly refresh of existing profiles for follower-history snapshots.
    - cron: "47 4 * * 0"

  workflow_dispatch:
    inputs:
      mode:
        description: "Manual test mode"
        required: true
        default: daily
        type: choice
        options:
          - daily
          - weekly_refresh

permissions:
  contents: write

concurrency:
  group: influrank-autopilot
  cancel-in-progress: false

jobs:
  daily:
    if: >
      github.event_name == 'workflow_dispatch' && inputs.mode == 'daily'
      || github.event_name == 'schedule' && github.event.schedule == '17 4 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install -r apps/discovery/requirements.txt
          python -m pip install -r apps/enrichment/requirements.txt

      - name: Read autopilot cursor
        id: cursor
        shell: bash
        run: |
          python -m apps.automation.state show-shell | tee /tmp/influrank_state
          cat /tmp/influrank_state >> "$GITHUB_OUTPUT"

      - name: Discover next seed batch
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          PYTHONUNBUFFERED: "1"
        run: |
          python -m apps.discovery run \
            --results-per-seed 10 \
            --start-seed "${{ steps.cursor.outputs.START_SEED }}" \
            --max-seeds "${{ steps.cursor.outputs.BATCH_SIZE }}" \
            --min-followers 10000 \
            --min-pl-signals 1 \
            --min-pl-confidence 50 \
            --sort-type RELEVANCE \
            --date-range LAST_THREE_MONTHS

      - name: Advance discovery cursor
        run: python -m apps.automation.state advance

      - name: Enrich only new pending creators
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          PYTHONUNBUFFERED: "1"
        run: |
          python -m apps.enrichment run \
            --max-profiles 10 \
            --max-posts 13

      - name: Upload daily provider diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autopilot-daily-provider-raw
          path: |
            apps/discovery/data/discovery_raw_full.json
            apps/enrichment/data/enrichment_raw_full.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Commit daily pipeline state and data
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            database/data/pipeline_state.json \
            database/data/enriched_creators.json \
            database/data/posts.json \
            database/data/creator_snapshots.json \
            apps/web/data/discovery_candidates.json \
            apps/web/data/scanner_queue.json \
            apps/web/data/discovery_raw.json \
            apps/web/data/creators.json

          if git diff --cached --quiet; then
            echo "No autopilot changes to commit."
            exit 0
          fi

          git commit -m "data: run InfluRank autopilot"
          git push origin HEAD:main

  weekly_refresh:
    if: >
      github.event_name == 'workflow_dispatch' && inputs.mode == 'weekly_refresh'
      || github.event_name == 'schedule' && github.event.schedule == '47 4 * * 0'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install enrichment dependencies
        run: python -m pip install -r apps/enrichment/requirements.txt

      - name: Refresh oldest creator profiles
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          PYTHONUNBUFFERED: "1"
        run: |
          python -m apps.enrichment run \
            --max-profiles 25 \
            --max-posts 13 \
            --refresh-all

      - name: Upload weekly provider diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autopilot-weekly-refresh-provider-raw
          path: apps/enrichment/data/enrichment_raw_full.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Commit refreshed profiles and snapshots
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            database/data/enriched_creators.json \
            database/data/posts.json \
            database/data/creator_snapshots.json \
            apps/web/data/scanner_queue.json \
            apps/web/data/creators.json

          if git diff --cached --quiet; then
            echo "No weekly refresh changes to commit."
            exit 0
          fi

          git commit -m "data: refresh InfluRank creator snapshots"
          git push origin HEAD:main
