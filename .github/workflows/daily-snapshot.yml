name: InfluRank daily snapshot

on:
  schedule:
    # Autopilot v4 is scheduled at 04:17 UTC.
    # Snapshot starts later to reduce write races with main.
    - cron: "17 7 * * *"

  workflow_dispatch:
    inputs:
      max_profiles:
        description: "0 = all current ranked creators; use e.g. 20 for a test"
        required: true
        default: "0"
        type: string
      delay_seconds:
        description: "Delay between public TikTok profile requests"
        required: true
        default: "4.0"
        type: string
      snapshot_date:
        description: "Optional UTC date YYYY-MM-DD; leave blank for today"
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: influrank-daily-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: apps/snapshots/requirements.txt

      - name: Install snapshot dependencies
        run: python -m pip install -r apps/snapshots/requirements.txt

      - name: Resolve settings
        id: settings
        shell: bash
        run: |
          MAX_PROFILES="${{ inputs.max_profiles }}"
          DELAY_SECONDS="${{ inputs.delay_seconds }}"
          SNAPSHOT_DATE="${{ inputs.snapshot_date }}"

          [ -n "$MAX_PROFILES" ] || MAX_PROFILES="0"
          [ -n "$DELAY_SECONDS" ] || DELAY_SECONDS="4.0"

          if [ -z "$SNAPSHOT_DATE" ]; then
            SNAPSHOT_DATE="$(date -u +%F)"
          fi

          echo "MAX_PROFILES=$MAX_PROFILES" >> "$GITHUB_OUTPUT"
          echo "DELAY_SECONDS=$DELAY_SECONDS" >> "$GITHUB_OUTPUT"
          echo "SNAPSHOT_DATE=$SNAPSHOT_DATE" >> "$GITHUB_OUTPUT"

      - name: Snapshot current creators
        shell: bash
        env:
          PYTHONUNBUFFERED: "1"
          SNAPSHOT_MAX_REQUESTS_PER_RUN: "2000"
          SNAPSHOT_REQUEST_TIMEOUT_SECONDS: "25"
        run: |
          set -euo pipefail

          SNAPSHOT_DATE="${{ steps.settings.outputs.SNAPSHOT_DATE }}"
          MAX_PROFILES="${{ steps.settings.outputs.MAX_PROFILES }}"
          DELAY_SECONDS="${{ steps.settings.outputs.DELAY_SECONDS }}"

          # Up to 3 passes on the SAME day.
          # A WAF/interstitial is respected: we stop requests, cool down,
          # then resume only still-pending profiles.
          for PASS in 1 2 3; do
            echo "=== Snapshot pass ${PASS}/3 for ${SNAPSHOT_DATE} ==="

            python -m apps.snapshots.cli run \
              --date "$SNAPSHOT_DATE" \
              --max-profiles "$MAX_PROFILES" \
              --delay-seconds "$DELAY_SECONDS"

            STATUS="$(python - <<'PY'
          import json
          with open("database/data/profile_snapshot_state.json", encoding="utf-8") as f:
              state = json.load(f)
          print(state.get("status", "partial"))
          PY
          )"

            LIMITED="$(python - <<'PY'
          import json
          with open("database/data/profile_snapshot_state.json", encoding="utf-8") as f:
              state = json.load(f)
          print("true" if state.get("stopped_by_rate_limit") else "false")
          PY
          )"

            MISSING="$(python - <<'PY'
          import json
          with open("database/data/profile_snapshot_state.json", encoding="utf-8") as f:
              state = json.load(f)
          print(state.get("missing_current_profiles", 0))
          PY
          )"

            echo "pass=${PASS} status=${STATUS} missing=${MISSING} limited=${LIMITED}"

            if [ "$STATUS" = "complete" ]; then
              echo "Daily snapshot complete."
              break
            fi

            if [ "$PASS" -eq 3 ]; then
              echo "Snapshot remains partial after 3 passes; partial data will be committed safely."
              break
            fi

            if [ "$LIMITED" = "true" ]; then
              echo "Public TikTok access limited. Cooling down for 10 minutes before resume."
              sleep 600
            else
              echo "Some retryable profiles remain. Waiting 90 seconds before resume."
              sleep 90
            fi
          done

      - name: Upload snapshot diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-profile-snapshot
          path: |
            database/data/profile_snapshot_state.json
            database/data/growth_metrics.json
            database/data/profile_snapshots/
          if-no-files-found: warn
          retention-days: 7

      - name: Write run summary
        if: always()
        shell: bash
        run: |
          if [ ! -f database/data/profile_snapshot_state.json ]; then
            exit 0
          fi

          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          state = json.loads(Path("database/data/profile_snapshot_state.json").read_text(encoding="utf-8"))

          print("## InfluRank daily snapshot")
          print()
          print(f"- Date: **{state.get('latest_snapshot_date', '—')}**")
          print(f"- Status: **{state.get('status', '—')}**")
          print(f"- Creators: **{state.get('current_creator_count', 0)}**")
          print(f"- Processed: **{state.get('processed_current_profiles', 0)}**")
          print(f"- OK: **{state.get('successful_current_profiles', 0)}**")
          print(f"- Unavailable/not found: **{state.get('unavailable_current_profiles', 0)}**")
          print(f"- Missing/retryable: **{state.get('missing_current_profiles', 0)}**")
          print(f"- Rate limited: **{state.get('stopped_by_rate_limit', False)}**")
          PY

      - name: Commit daily snapshot history
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            database/data/profile_snapshots \
            database/data/profile_snapshot_state.json \
            database/data/growth_metrics.json

          if git diff --cached --quiet; then
            echo "No snapshot changes to commit."
            exit 0
          fi

          SNAPSHOT_DATE="${{ steps.settings.outputs.SNAPSHOT_DATE }}"
          git commit -m "data: daily creator snapshot ${SNAPSHOT_DATE}"

          # Commit first, rebase second: avoids the old
          # "cannot pull with rebase: You have unstaged changes" failure.
          git pull --rebase origin main

          if ! git push origin HEAD:main; then
            echo "Push raced with another main update; rebasing once and retrying."
            git pull --rebase origin main
            git push origin HEAD:main
          fi
