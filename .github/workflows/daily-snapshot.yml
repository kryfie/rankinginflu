name: InfluRank daily snapshot

on:
  schedule:
    # Autopilot v4 is scheduled at 04:17 UTC.
    # Snapshot runs three hours later to reduce the chance of both
    # workflows writing to main at the same time.
    - cron: "17 7 * * *"

  workflow_dispatch:
    inputs:
      max_profiles:
        description: "0 = all current ranked creators; use e.g. 20 for a test"
        required: true
        default: "0"
        type: string
      delay_seconds:
        description: "Delay between public TikTok profile requests"
        required: true
        default: "2.5"
        type: string
      snapshot_date:
        description: "Optional UTC date YYYY-MM-DD; leave blank for today"
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: influrank-daily-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: apps/snapshots/requirements.txt

      - name: Install snapshot dependencies
        run: python -m pip install -r apps/snapshots/requirements.txt

      - name: Resolve settings
        id: settings
        shell: bash
        run: |
          MAX_PROFILES="${{ inputs.max_profiles }}"
          DELAY_SECONDS="${{ inputs.delay_seconds }}"
          SNAPSHOT_DATE="${{ inputs.snapshot_date }}"

          [ -n "$MAX_PROFILES" ] || MAX_PROFILES="0"
          [ -n "$DELAY_SECONDS" ] || DELAY_SECONDS="2.5"

          # Scheduled runs have no workflow_dispatch input, so use current UTC day.
          if [ -z "$SNAPSHOT_DATE" ]; then
            SNAPSHOT_DATE="$(date -u +%F)"
          fi

          echo "MAX_PROFILES=$MAX_PROFILES" >> "$GITHUB_OUTPUT"
          echo "DELAY_SECONDS=$DELAY_SECONDS" >> "$GITHUB_OUTPUT"
          echo "SNAPSHOT_DATE=$SNAPSHOT_DATE" >> "$GITHUB_OUTPUT"

      - name: Snapshot current creators
        env:
          PYTHONUNBUFFERED: "1"
          SNAPSHOT_MAX_REQUESTS_PER_RUN: "2000"
          SNAPSHOT_REQUEST_TIMEOUT_SECONDS: "25"
        run: |
          python -m apps.snapshots.cli run \
            --date "${{ steps.settings.outputs.SNAPSHOT_DATE }}" \
            --max-profiles "${{ steps.settings.outputs.MAX_PROFILES }}" \
            --delay-seconds "${{ steps.settings.outputs.DELAY_SECONDS }}"

      - name: Upload snapshot diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-profile-snapshot
          path: |
            database/data/profile_snapshot_state.json
            database/data/growth_metrics.json
            database/data/profile_snapshots/
          if-no-files-found: warn
          retention-days: 7

      - name: Commit daily snapshot history
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            database/data/profile_snapshots \
            database/data/profile_snapshot_state.json \
            database/data/growth_metrics.json

          if git diff --cached --quiet; then
            echo "No snapshot changes to commit."
            exit 0
          fi

          # IMPORTANT:
          # Commit first, then rebase. The old workflow tried
          # `git pull --rebase` while snapshot files were still modified,
          # which caused:
          #   error: cannot pull with rebase: You have unstaged changes.
          SNAPSHOT_DATE="${{ steps.settings.outputs.SNAPSHOT_DATE }}"
          git commit -m "data: daily creator snapshot ${SNAPSHOT_DATE}"

          # Bring in any main changes that appeared while scanning.
          git pull --rebase origin main

          # Small retry protects against a normal non-fast-forward race.
          if ! git push origin HEAD:main; then
            echo "Push raced with another main update; rebasing once and retrying."
            git pull --rebase origin main
            git push origin HEAD:main
          fi
