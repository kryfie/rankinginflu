name: InfluRank discovery

on:
  workflow_dispatch:
    inputs:
      results_per_seed:
        description: "Posts per seed (Free Apify demo caps a run at 10)"
        required: true
        default: "10"
        type: string
      start_seed:
        description: "Seed offset: 0 = first seed, 2 = third seed, 4 = fifth seed..."
        required: true
        default: "0"
        type: string
      max_seeds:
        description: "How many seeds to run from start_seed; 0 = all remaining"
        required: true
        default: "2"
        type: string
      min_followers:
        description: "Minimum followers for a new candidate"
        required: true
        default: "10000"
        type: string
      min_pl_signals:
        description: "Minimum lightweight PL signals before profile enrichment"
        required: true
        default: "1"
        type: string
      sort_type:
        description: "TikTok search sort"
        required: true
        type: choice
        options:
          - RELEVANCE
          - MOST_LIKED
          - DATE_POSTED
        default: RELEVANCE
      date_range:
        description: "TikTok search date range"
        required: true
        type: choice
        options:
          - THIS_MONTH
          - LAST_THREE_MONTHS
          - LAST_SIX_MONTHS
          - ALL_TIME
        default: LAST_THREE_MONTHS

permissions:
  contents: write

jobs:
  discovery:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install discovery dependencies
        run: python -m pip install -r apps/discovery/requirements.txt

      - name: Run seed-by-seed discovery
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          PYTHONUNBUFFERED: "1"
        run: |
          python -m apps.discovery run \
            --results-per-seed "${{ inputs.results_per_seed }}" \
            --start-seed "${{ inputs.start_seed }}" \
            --max-seeds "${{ inputs.max_seeds }}" \
            --min-followers "${{ inputs.min_followers }}" \
            --min-pl-signals "${{ inputs.min_pl_signals }}" \
            --sort-type "${{ inputs.sort_type }}" \
            --date-range "${{ inputs.date_range }}"

      - name: Upload full raw provider payload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: discovery-provider-raw
          path: apps/discovery/data/discovery_raw_full.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Commit persistent discovery data
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            apps/web/data/discovery_candidates.json \
            apps/web/data/scanner_queue.json \
            apps/web/data/discovery_raw.json

          if git diff --cached --quiet; then
            echo "No persistent discovery changes to commit."
            exit 0
          fi

          git commit -m "data: update TikTok discovery"
          git push origin HEAD:main
