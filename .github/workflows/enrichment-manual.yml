name: InfluRank enrichment

on:
  workflow_dispatch:
    inputs:
      max_profiles:
        description: "How many queue profiles to enrich; 0 = all eligible"
        required: true
        default: "5"
        type: string
      max_posts:
        description: "Latest posts per profile (max 13)"
        required: true
        default: "13"
        type: string
      refresh_all:
        description: "Refresh accounts already enriched"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  enrichment:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install enrichment dependencies
        run: python -m pip install -r apps/enrichment/requirements.txt

      - name: Enrich queue
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          PYTHONUNBUFFERED: "1"
        shell: bash
        run: |
          ARGS=(
            run
            --max-profiles "${{ inputs.max_profiles }}"
            --max-posts "${{ inputs.max_posts }}"
          )

          if [ "${{ inputs.refresh_all }}" = "true" ]; then
            ARGS+=(--refresh-all)
          fi

          python -m apps.enrichment "${ARGS[@]}"

      - name: Upload full enrichment payload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: enrichment-provider-raw
          path: apps/enrichment/data/enrichment_raw_full.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Commit enrichment state and ranking
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            database/data/enriched_creators.json \
            database/data/posts.json \
            database/data/creator_snapshots.json \
            apps/web/data/scanner_queue.json \
            apps/web/data/creators.json

          if git diff --cached --quiet; then
            echo "No enrichment changes to commit."
            exit 0
          fi

          git commit -m "data: enrich TikTok creators"
          git push origin HEAD:main
