name: Rebuild InfluRank ranking

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r apps/enrichment/requirements.txt

      - name: Reclassify creators and rebuild ranking
        run: python -m apps.enrichment.rebuild

      - name: Re-apply creator geo signals
        run: python -m apps.automation.geo harvest

      - name: Build data quality report
        run: python -m apps.automation.quality report

      - name: Commit reclassified creators and rebuilt ranking
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            database/data/enriched_creators.json \
            database/data/geo_evidence.json \
            database/data/quality_report.json \
            apps/web/data/creators.json

          if git diff --cached --quiet; then
            echo "No classification/ranking changes to commit."
            exit 0
          fi

          git commit -m "data: classify creators and rebuild ranking"
          git push origin HEAD:main
