name: Rebuild InfluRank ranking

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r apps/enrichment/requirements.txt

      - name: Rebuild ranking from existing stored data
        run: python -m apps.enrichment.rebuild

      - name: Commit rebuilt ranking
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add apps/web/data/creators.json

          if git diff --cached --quiet; then
            echo "No ranking changes to commit."
            exit 0
          fi

          git commit -m "data: rebuild InfluRank ranking"
          git push origin HEAD:main
