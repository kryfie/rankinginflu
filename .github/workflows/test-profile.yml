name: Test TikTok profile

on:
  workflow_dispatch:
    inputs:
      handle:
        description: "TikTok username, e.g. @jeleniewska"
        required: true
        default: "@jeleniewska"
        type: string
      posts:
        description: "Public posts to request. Use 0 for profile-only validation."
        required: true
        default: "0"
        type: string

jobs:
  test-profile:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Prepare output directories
        run: mkdir -p apps/scanner/data apps/web/data diagnostics

      - name: Scan public TikTok profile
        env:
          REQUEST_DELAY_SECONDS: "3"
          MAX_REQUESTS_PER_RUN: "20"
          PYTHONUNBUFFERED: "1"
          ENABLE_BROWSER_FALLBACK: "0"
          DIAGNOSTICS_DIR: "diagnostics"
        shell: bash
        run: |
          set -o pipefail
          python -m apps.scanner.scanner.cli scan \
            "${{ inputs.handle }}" \
            --posts "${{ inputs.posts }}" \
            2>&1 | tee diagnostics/profile-scan.log

      - name: Upload profile test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: profile-test-output
          if-no-files-found: warn
          retention-days: 7
          path: |
            diagnostics/profile-scan.log
            apps/scanner/data/
            apps/web/data/creators.json
