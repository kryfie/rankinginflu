name: Test TikTok profile

on:
  workflow_dispatch:
    inputs:
      handle:
        description: "TikTok username, np. @jeleniewska"
        required: true
        type: string

      posts:
        description: "Ile ostatnich filmów pobrać"
        required: true
        default: "10"
        type: string

jobs:
  test-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Show test parameters
        run: |
          echo "======================================"
          echo "InfluRank TikTok profile test"
          echo "======================================"
          echo "Handle: ${{ inputs.handle }}"
          echo "Posts:  ${{ inputs.posts }}"
          echo "======================================"

      - name: Prepare output directories
        run: |
          mkdir -p apps/scanner/data
          mkdir -p apps/web/data
          mkdir -p diagnostics

      - name: Scan TikTok profile
        env:
          REQUEST_DELAY_SECONDS: "3"
          MAX_REQUESTS_PER_RUN: "50"
          PYTHONUNBUFFERED: "1"
        shell: bash
        run: |
          set -o pipefail

          echo "Starting profile scan..."
          echo ""

          python -m apps.scanner.scanner.cli scan \
            "${{ inputs.handle }}" \
            --posts "${{ inputs.posts }}" \
            2>&1 | tee diagnostics/profile-scan.log

          echo ""
          echo "Scanner finished."

      - name: Show generated creators.json
        if: always()
        shell: bash
        run: |
          echo "======================================"
          echo "CREATORS.JSON"
          echo "======================================"

          if [ -f apps/web/data/creators.json ]; then
            cat apps/web/data/creators.json
          else
            echo "creators.json was not created"
          fi

      - name: Show database information
        if: always()
        shell: bash
        run: |
          echo "======================================"
          echo "SCANNER DATA FILES"
          echo "======================================"

          if [ -d apps/scanner/data ]; then
            ls -lah apps/scanner/data
          else
            echo "apps/scanner/data does not exist"
          fi

      - name: Save diagnostic information
        if: always()
        shell: bash
        run: |
          {
            echo ""
            echo "======================================"
            echo "RUN INFORMATION"
            echo "======================================"
            echo "Handle: ${{ inputs.handle }}"
            echo "Requested posts: ${{ inputs.posts }}"
            echo "Runner OS: $RUNNER_OS"
            echo "Python:"
            python --version
            echo ""
            echo "Generated files:"
            find apps/scanner/data apps/web/data -maxdepth 2 -type f -printf '%p %s bytes\n' 2>/dev/null || true
          } >> diagnostics/profile-scan.log

      - name: Upload scanner output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: profile-test-output
          if-no-files-found: warn
          retention-days: 7
          path: |
            diagnostics/profile-scan.log
            apps/scanner/data/
            apps/web/data/creators.json
