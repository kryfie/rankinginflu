<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07111f">
  <meta name="robots" content="noindex">
  <title>Dziękujemy — KtoWybija</title>
  <link rel="icon" href="./favicon.png" type="image/png">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at 50% 0%, rgba(55,231,196,.08), transparent 32rem),
        #07111f;
      color: #f7fbff;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .card {
      width: min(620px, 100%);
      padding: 42px;
      border: 1px solid rgba(156,181,212,.18);
      border-radius: 24px;
      background: rgba(14,28,47,.96);
      text-align: center;
      box-shadow: 0 24px 80px rgba(0,0,0,.28);
    }
    .logo {
      display: block;
      width: 250px;
      max-width: 75%;
      height: auto;
      margin: 0 auto 26px;
    }
    .check {
      width: 56px;
      height: 56px;
      display: grid;
      place-items: center;
      margin: 0 auto 18px;
      border-radius: 50%;
      background: rgba(55,231,196,.12);
      color: #37e7c4;
      font-size: 27px;
      font-weight: 900;
    }
    h1 {
      margin: 0 0 12px;
      font-size: clamp(32px, 6vw, 42px);
      letter-spacing: -.04em;
    }
    p {
      max-width: 480px;
      margin: 0 auto 28px;
      color: #8fa4bd;
      line-height: 1.65;
    }
    a {
      display: inline-block;
      padding: 13px 20px;
      border-radius: 12px;
      background: #37e7c4;
      color: #03201c;
      text-decoration: none;
      font-weight: 850;
    }
  </style>
</head>
<body>
  <main class="card">
    <img class="logo" src="./assets/ktowybija-logo.png" alt="KtoWybija">
    <div class="check">✓</div>
    <h1>Dzięki za wiadomość.</h1>
    <p>
      Twoje zapytanie zostało wysłane. Jeśli dotyczy współpracy z marką lub agencją,
      odezwiemy się na podany adres e-mail.
    </p>
    <a href="/">Wróć do rankingu</a>
  </main>
</body>
</html>
