<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07111f">
  <title>Dziękujemy — KtoWybija</title>
  <link rel="icon" href="./favicon.png" type="image/png">
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#07111f;color:#f7fbff;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:24px}
    .card{width:min(620px,100%);padding:44px;border:1px solid rgba(156,181,212,.22);border-radius:24px;background:#0e1c2f;text-align:center}
    .dot{width:54px;height:54px;margin:0 auto 18px;border-radius:50%;display:grid;place-items:center;background:rgba(55,231,196,.12);color:#37e7c4;font-size:26px;font-weight:900}
    h1{margin:0 0 12px;font-size:38px;letter-spacing:-.04em}
    p{margin:0 auto 26px;max-width:460px;color:#8fa4bd;line-height:1.65}
    .button{display:inline-block;padding:13px 18px;border-radius:12px;background:#37e7c4;color:#03201c;text-decoration:none;font-weight:850}
  </style>
</head>
<body>
  <main class="card">
    <div class="dot">✓</div>
    <h1>Dzięki za wiadomość.</h1>
    <p>Zapytanie zostało wysłane. Wróć do rankingu KtoWybija.</p>
    <a class="button" href="/">Wróć do rankingu</a>
  </main>
</body>
</html>
